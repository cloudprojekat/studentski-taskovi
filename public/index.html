<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="container">
      <h1>Tasks</h1>
      <div class="subtitle"></div>
    </header>

    <main class="container">
      <section class="card">
        <h2>Dodaj novi task</h2>
        <form id="newTaskForm" autocomplete="off">
          <div class="row">
            <input
              id="titleInput"
              type="text"
              placeholder="npr. Kupi mleko"
              required
              minlength="2"
            />
            <input id="dueDateInput" type="date" />
          </div>
          <div class="row">
            <input
              id="labelsInput"
              type="text"
              placeholder="komentar (opciono)"
            />
            <button type="submit">Sačuvaj</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="toolbar">
          <input
            id="searchInput"
            type="search"
            placeholder="Pretraga po naslovu…"
          />
          <select id="statusSelect" title="Filter status">
            <option value="">Svi</option>
            <option value="false">Aktivni</option>
            <option value="true">Završeni</option>
          </select>
          <button id="reloadBtn" class="ghost">Osveži</button>
        </div>
      </section>

      <section class="card">
        <div class="list-head">
          <span>Task</span>
          <span>Rok</span>
          <span>Komentar</span>
          <span>Akcije</span>
        </div>
        <ul id="taskList" class="list"></ul>
        <div id="emptyState" class="empty" hidden>Trenutno nema stavki.</div>
        <div id="loading" class="loading" hidden>Učitavanje…</div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
