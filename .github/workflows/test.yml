name: Test Pipeline
on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build test Docker slike
        run: docker build -t aplikacija:test-v${{ github.run_number }} .
      - name: Pokretanje integracionih testova
        run: echo "Ovde se izvrsavaju integracioni testovi"